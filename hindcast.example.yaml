# Copy to hindcast.yaml. Tool names below depend on the MCP server versions
# you run; check them with `hindcast tools`.

# Any OpenAI-compatible endpoint works with provider: openai. The key is read
# from the variable named in api_key_env and never goes in this file; leave
# api_key_env out for local servers that need no key.
model:
  provider: openai
  name: gpt-5
  api_key_env: HINDCAST_API_KEY

# Ollama, local, no key:
#   provider: openai
#   name: qwen3:32b
#   base_url: http://localhost:11434/v1
#
# Google Gemini:
#   provider: openai
#   name: gemini-2.5-pro
#   base_url: https://generativelanguage.googleapis.com/v1beta/openai
#   api_key_env: HINDCAST_API_KEY
#
# OpenRouter (many vendors behind one key):
#   provider: openai
#   name: deepseek/deepseek-chat
#   base_url: https://openrouter.ai/api/v1
#   api_key_env: HINDCAST_API_KEY
#
# Anthropic, native API:
#   provider: anthropic
#   name: claude-sonnet-5-5
#   api_key_env: HINDCAST_API_KEY

servers:
  # containers/kubernetes-mcp-server, checked with v0.1.3: hindcast offers its
  # 15 read-only tools and hides the 6 that change the cluster
  # (pods_delete, pods_exec, pods_run, resources_create_or_update,
  # resources_delete, resources_scale).
  k8s:
    command: [npx, -y, kubernetes-mcp-server@latest]

budget:
  max_steps: 15
  max_tokens: 4096
  tool_timeout: 30s
  max_result_bytes: 16384

prefetch:
  - tool: k8s__events_list
    args:
      namespace: "{{.Labels.namespace}}"
  - tool: k8s__pods_list_in_namespace
    args:
      namespace: "{{.Labels.namespace}}"

# Masking of tool output before the model and the trace see it. The built-in
# rules are on by default; add regexps for identifiers of your own.
# redact:
#   patterns: ['cust-[0-9]{6}']

# notify:
#   slack:
#     webhook_url_env: SLACK_WEBHOOK_URL

# Grades `hindcast eval` results against scenario references. Prefer a
# different model from the one being evaluated.
# judge:
#   provider: openai
#   name: gpt-5
#   api_key_env: HINDCAST_JUDGE_API_KEY
